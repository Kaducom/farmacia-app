<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />

    <title>Avisai</title>

    <!-- Ícones do navegador -->
    <link
      rel="icon"
      type="image/x-icon"
      href="/icons/avisai-rocket.ico?v=rocket-2"
    />

    <link
      rel="shortcut icon"
      type="image/x-icon"
      href="/icons/avisai-rocket.ico?v=rocket-2"
    />

    <link
      rel="icon"
      type="image/png"
      sizes="16x16"
      href="/icons/favicon-16x16.png?v=rocket-2"
    />

    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="/icons/favicon-32x32.png?v=rocket-2"
    />

    <link
      rel="icon"
      type="image/png"
      sizes="64x64"
      href="/icons/favicon-64.png?v=rocket-2"
    />

    <!-- Ícone iPhone/iPad -->
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="/icons/apple-touch-icon.png?v=rocket-2"
    />

    <!-- Manifest PWA -->
    <link rel="manifest" href="/manifest.json?v=rocket-2" />

    <!-- Cores do app -->
    <meta name="theme-color" content="#071F1E" />
    <meta name="msapplication-TileColor" content="#071F1E" />

    <!-- Ícone Windows / Microsoft -->
    <meta name="msapplication-TileImage" content="/icons/icon-192.png?v=rocket-2" />

    <!-- Nome do app -->
    <meta name="application-name" content="Avisai" />
    <meta name="apple-mobile-web-app-title" content="Avisai" />

    <!-- PWA Android/iOS -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />

    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />

    <!-- SEO / descrição -->
    <meta
      name="description"
      content="Avisai: sistema inteligente para controle de produtos, validade, estoque, setores, scanner e sincronização."
    />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
